[package]
name = "all-in-one-mcp-tauri"
version = "0.1.0"
description = "Tauri desktop shell for the All-in-One MCP dashboard"
authors = ["James Wright"]
edition = "2021"

[lib]
name = "all_in_one_mcp_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.9.2", features = ["tray-icon"] }
tauri-plugin-autostart = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
